# plastic-ai — public environment (AWS profile UCL-Public) config
version: 1.3.16
cache: true

fileStrategy: "s3"

interface:
  customWelcome: 'Welcome to LibreChat! Enjoy your experience.'
  fileSearch: true

  privacyPolicy:
    externalUrl: 'https://librechat.ai/privacy-policy'
    openNewTab: true

  termsOfService:
    externalUrl: 'https://librechat.ai/tos'
    openNewTab: true
    modalAcceptance: true
    modalTitle: 'Terms of Service for plastic-ai'
    modalContent: |
      Replace with your Terms of Service.

  modelSelect: true
  parameters: true
  presets: false
  prompts:
    use: false
    create: false
    share: false
    public: false
  bookmarks: false
  multiConvo: true
  # File search runs through agents, so they are on here as in the sandbox.
  # Skill imports take .zip/.skill archives and files of any type, which the
  # upload policy does not allow, so users cannot create skills.
  skills:
    use: true
    create: false
    share: false
    public: false
  agents:
    use: true
    create: true
    share: false
    public: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  marketplace:
    use: false
  fileCitations: true
  feedback: true

registration:
  socialLogins: ["openid"]

# Uploads: documents, ebooks, text and images only, at most 100 MB a file and
# 2 GB of stored files per user (userStorageLimit counts every file a user
# holds). Every upload's extension must be listed, and its MIME type must match
# supportedMimeTypes as well. The limits are set for agents and bedrock too,
# because those built-in endpoints carry their own defaults.
fileConfig:
  serverFileSizeLimit: 100
  userStorageLimit: 2048
  allowedExtensions:
    [doc, docx, rtf, pdf, xls, xlsx, csv, tsv, ppt, pptx,
     epub,
     txt, htm, html, json, xml, yaml, yml, md,
     png, jpg, jpeg, jpe, tif, tiff, gif, bmp, webp, svg, jp2, heic]
  endpoints:
    default: &uploads
      fileSizeLimit: 100
      supportedMimeTypes:
        - '^application/(msword|rtf|pdf|json|xml|yaml|x-yaml|epub\+zip|vnd\.ms-excel|vnd\.ms-powerpoint)$'
        - '^application/vnd\.openxmlformats-officedocument\.(wordprocessingml\.document|spreadsheetml\.sheet|presentationml\.presentation)$'
        - '^text/(plain|html|csv|tab-separated-values|xml|yaml|x-yaml|markdown|x-markdown|rtf)$'
        - '^image/(png|jpeg|tiff|gif|bmp|webp|svg\+xml|jp2|heic|heif)$'
    agents: *uploads
    bedrock: *uploads

# Voice input starts off. This is only a default: a browser that already saved a
# choice keeps it, and users can turn it on again in Settings > Speech.
speech:
  speechTab:
    speechToText: false

# Enforced on the server for every chat, agent and API request. A message over
# maxUserMessageChars is refused before it reaches a model; maxOutputTokens caps
# each response, reasoning included (Bedrock counts both against one budget).
messageLimits:
  maxUserMessageChars: 20000
  maxOutputTokens: 8192

# Per-user usage quota: $1.50 of model cost per 5-hour session (1,000,000
# credits = $1, charged at each model's price). That is about 100 typical
# Sonnet 5 turns (3,000 tokens in, history included, and 800 out). A user who
# runs out is refused until 5 hours after their last refill; their next request
# then refills them. Refills only top up an exhausted balance, so unused quota
# does not pile up.
balance:
  enabled: true
  startBalance: 1500000
  autoRefillEnabled: true
  refillIntervalValue: 5
  refillIntervalUnit: 'hours'
  refillAmount: 1500000

actions:
  allowedDomains:
    - 'google.com'

endpoints:
  agents:
    capabilities: ["file_search", "web_search", "context", "ask_user_question", "tools"]

  bedrock:
    models:
      - 'eu.anthropic.claude-sonnet-5'
    inferenceProfiles:
      'eu.anthropic.claude-sonnet-5': 'arn:aws:bedrock:eu-west-2:575062583775:inference-profile/eu.anthropic.claude-sonnet-5'
    # chaild-test-guardrail-dev-v2; the task role may apply it (bedrock_guardrail_arns).
    guardrailConfig:
      guardrailIdentifier: 'arn:aws:bedrock:eu-west-2:575062583775:guardrail/qpq72rkzv8qy'
      guardrailVersion: '1'
      trace: 'enabled'

  custom:
    # The PII proxy service in the same VPC (Cloud Map: pii-proxy.plastic-ai.local).
    # It takes no credential; the key is a placeholder the client requires.
    - name: 'PII Proxy'
      apiKey: 'dummy'
      baseURL: 'http://pii-proxy.plastic-ai.local:8000/v1'
      models:
        default:
          - 'eu.anthropic.claude-sonnet-5'
        fetch: false
      headers:
        X-Conversation-ID: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      titleConvo: false
      modelDisplayLabel: 'Claude Sonnet 5'

modelSpecs:
  list:
    - name: 'bedrock-claude-sonnet-5'
      label: 'Claude Sonnet 5 (Bedrock)'
      description: 'Anthropic Claude Sonnet 5 via AWS Bedrock (eu-west-2, EU geo profile)'
      preset:
        endpoint: 'bedrock'
        model: 'eu.anthropic.claude-sonnet-5'
    - name: 'bedrock-claude-sonnet-5-pii-proxy'
      label: 'Claude Sonnet 5 (PII Proxy)'
      description: 'Claude Sonnet 5 routed through the PII proxy'
      preset:
        endpoint: 'PII Proxy'
        model: 'eu.anthropic.claude-sonnet-5'
