# plastic-ai — real AWS (Bedrock) config
version: 1.3.16
cache: true

fileStrategy: "s3"

interface:
  customWelcome: 'Welcome to LibreChat! Enjoy your experience.'
  fileSearch: true

  privacyPolicy:
    externalUrl: 'https://librechat.ai/privacy-policy'
    openNewTab: true

  termsOfService:
    externalUrl: 'https://librechat.ai/tos'
    openNewTab: true
    modalAcceptance: true
    modalTitle: 'Terms of Service for plastic-ai'
    modalContent: |
      Replace with your Terms of Service.

  modelSelect: true
  parameters: true
  presets: false
  prompts:
    use: false
    create: false
    share: false
    public: false
  bookmarks: false
  multiConvo: true
  # Skill imports take .zip/.skill archives and files of any type, which the
  # upload policy does not allow, so users cannot create skills.
  skills:
    use: true
    create: false
    share: false
    public: false
  agents:
    use: false
    create: false
    share: false
    public: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  marketplace:
    use: false
  fileCitations: true
  feedback: true
  # Not offered here: sharing (ALLOW_SHARED_LINKS=false also closes the server
  # side), user-added MCP servers, web search (no provider configured),
  # links that send a prompt when opened, unsaved chats, and two inert options
  # (no memory or code service is configured).
  sharedLinks: false
  mcpServers:
    use: false
    create: false
    share: false
    public: false
  webSearch: false
  autoSubmitFromUrl: false
  temporaryChat: false
  memories: false
  runCode: false
  # The model calls and tool spans behind each response, read from Langfuse and
  # shown to the conversation's owner only. Inert until the stack points the app
  # at Langfuse (observability_enabled and langfuse_domain in sandbox.tfvars).
  traceViewer:
    enabled: true
    showInputOutput: false

registration:
  socialLogins: ["openid"]

# Uploads: documents, ebooks, text and images only, at most 100 MB a file and
# 2 GB of stored files per user (userStorageLimit counts every file a user
# holds). Every upload's extension must be listed, and its MIME type must match
# supportedMimeTypes as well. The limits are set for agents and bedrock too,
# because those built-in endpoints carry their own defaults.
fileConfig:
  serverFileSizeLimit: 100
  userStorageLimit: 2048
  allowedExtensions:
    [doc, docx, rtf, pdf, xls, xlsx, csv, tsv, ppt, pptx,
     epub,
     txt, htm, html, json, xml, yaml, yml, md,
     png, jpg, jpeg, jpe, tif, tiff, gif, bmp, webp, svg, jp2, heic]
  endpoints:
    default: &uploads
      fileSizeLimit: 100
      supportedMimeTypes:
        - '^application/(msword|rtf|pdf|json|xml|yaml|x-yaml|epub\+zip|vnd\.ms-excel|vnd\.ms-powerpoint)$'
        - '^application/vnd\.openxmlformats-officedocument\.(wordprocessingml\.document|spreadsheetml\.sheet|presentationml\.presentation)$'
        - '^text/(plain|html|csv|tab-separated-values|xml|yaml|x-yaml|markdown|x-markdown|rtf)$'
        - '^image/(png|jpeg|tiff|gif|bmp|webp|svg\+xml|jp2|heic|heif)$'
    agents: *uploads
    bedrock: *uploads

# Voice input starts off. This is only a default: a browser that already saved a
# choice keeps it, and users can turn it on again in Settings > Speech.
speech:
  speechTab:
    speechToText: false

# Enforced on the server for every chat, agent and API request. A message over
# maxUserMessageChars is refused before it reaches a model; maxOutputTokens caps
# each response, reasoning included (Bedrock counts both against one budget).
messageLimits:
  maxUserMessageChars: 20000
  maxOutputTokens: 8192

# Per-user usage quota: $1.50 of model cost per 5-hour session (1,000,000
# credits = $1, charged at each model's price). That is about 100 typical
# Sonnet 5 turns (3,000 tokens in, history included, and 800 out). A user who
# runs out is refused until 5 hours after their last refill; their next request
# then refills them. Refills only top up an exhausted balance, so unused quota
# does not pile up.
balance:
  enabled: true
  startBalance: 1500000
  autoRefillEnabled: true
  refillIntervalValue: 5
  refillIntervalUnit: 'hours'
  refillAmount: 1500000

actions:
  allowedDomains:
    - 'google.com'

endpoints:
  agents:
    capabilities: ["file_search", "context", "ask_user_question", "tools"]

  # The sandbox is an AWS channel-program account: Bedrock refuses Anthropic
  # models there. These are the models it does serve on demand in eu-west-2, so
  # requests stay in London; each was checked with streaming and tool use.
  bedrock:
    models:
      - 'amazon.nova-lite-v1:0'
      - 'openai.gpt-oss-120b-1:0'
      - 'qwen.qwen3-235b-a22b-2507-v1:0'
      - 'moonshotai.kimi-k2.5'
      - 'deepseek.v3.2'
      - 'mistral.devstral-2-123b'
      - 'zai.glm-5'
      - 'nvidia.nemotron-super-3-120b'

modelSpecs:
  list:
    - name: 'bedrock-nova-lite'
      label: 'Nova Lite (Bedrock)'
      description: 'Amazon Nova Lite v1 via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'amazon.nova-lite-v1:0'
    - name: 'bedrock-gpt-oss-120b'
      label: 'gpt-oss-120b (Bedrock)'
      description: 'OpenAI open-weight 120B model via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'openai.gpt-oss-120b-1:0'
    - name: 'bedrock-qwen3-235b'
      label: 'Qwen3 235B (Bedrock)'
      description: 'Qwen3 235B A22B 2507 via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'qwen.qwen3-235b-a22b-2507-v1:0'
    - name: 'bedrock-kimi-k2-5'
      label: 'Kimi K2.5 (Bedrock)'
      description: 'Moonshot AI Kimi K2.5 via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'moonshotai.kimi-k2.5'
    - name: 'bedrock-deepseek-v3-2'
      label: 'DeepSeek V3.2 (Bedrock)'
      description: 'DeepSeek V3.2 via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'deepseek.v3.2'
    - name: 'bedrock-devstral-2'
      label: 'Devstral 2 (Bedrock)'
      description: 'Mistral AI Devstral 2 123B, tuned for coding, via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'mistral.devstral-2-123b'
    - name: 'bedrock-glm-5'
      label: 'GLM-5 (Bedrock)'
      description: 'Z.ai GLM-5 via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'zai.glm-5'
    - name: 'bedrock-nemotron-super-3'
      label: 'Nemotron Super 3 (Bedrock)'
      description: 'NVIDIA Nemotron Super 3 120B via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'nvidia.nemotron-super-3-120b'
