# plastic-ai — real AWS (Bedrock) config
version: 1.3.16
cache: true

fileStrategy: "s3"

interface:
  customWelcome: 'Welcome to LibreChat! Enjoy your experience.'
  # Deleting a chat or file removes it from the app, but not from the interaction
  # logs and traces the study keeps; the delete dialogs say so.
  deletionLogNotice: true
  # No RAG service runs here (rag_enabled in OpenTofu), so file search has
  # nothing to search; attached files still reach the model directly.
  fileSearch: false

  privacyPolicy:
    externalUrl: 'https://librechat.ai/privacy-policy'
    openNewTab: true

  termsOfService:
    externalUrl: 'https://librechat.ai/tos'
    openNewTab: true
    modalAcceptance: true
    modalTitle: 'Before you start'
    modalContent: |
      Thank you for taking part in the Investigating Children’s Agency when Learning with AI (CHAILD) study.

      **Please do not share personal information.** When you write messages or upload files, do not include:

      - names, email addresses, phone numbers or home addresses, yours or anyone else's
      - identification numbers, such as National Insurance, NHS, passport or student numbers
      - financial details, such as bank or card numbers
      - passwords or other login details
      - sensitive details, such as health, ethnicity, religion, sexual orientation or political views

      This applies to files too: do not upload documents or images that identify you or anyone else, or that contain sensitive details.

      As a safeguard, the app replaces many identifiers it detects with placeholders such as {EMAIL}, and refuses uploads that contain them. It will not catch everything, so please check before you send.

      Your conversations are recorded for the research, as described in the [participant information sheet](https://…). If you have questions, contact [name] at [email].

      By selecting **I accept**, you confirm that you have read these instructions.

  modelSelect: true
  parameters: true
  presets: false
  prompts:
    use: false
    create: false
    share: false
    public: false
  bookmarks: false
  multiConvo: true
  # Skill imports take .zip/.skill archives and files of any type, which the
  # upload policy does not allow, so users cannot create skills.
  skills:
    use: true
    create: false
    share: false
    public: false
  agents:
    use: false
    create: false
    share: false
    public: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  marketplace:
    use: false
  fileCitations: true
  feedback: true
  # Not offered here: sharing (ALLOW_SHARED_LINKS=false also closes the server
  # side), user-added MCP servers, web search (no provider configured),
  # links that send a prompt when opened, unsaved chats, and two inert options
  # (no memory or code service is configured).
  sharedLinks: false
  mcpServers:
    use: false
    create: false
    share: false
    public: false
  webSearch: false
  autoSubmitFromUrl: false
  temporaryChat: false
  memories: false
  runCode: false
  # The model calls and tool spans behind each response, read from Langfuse and
  # shown to the conversation's owner only. Inert until the stack points the app
  # at Langfuse (observability_enabled and langfuse_domain in sandbox.tfvars).
  # Off: traces stay readable in Langfuse itself.
  traceViewer:
    enabled: false
    showInputOutput: false

registration:
  socialLogins: ["openid"]

# Uploads: documents, text and images only, at most 100 MB a file and
# 2 GB of stored files per user (userStorageLimit counts every file a user
# holds). Every upload's extension must be listed, and its MIME type must match
# supportedMimeTypes as well. The limits are set for agents and bedrock too,
# because those built-in endpoints carry their own defaults.
fileConfig:
  serverFileSizeLimit: 100
  userStorageLimit: 2048
  allowedExtensions:
    [docx, pdf, xls, xlsx, csv, tsv, pptx,
     txt, htm, html, json, xml, yaml, yml, md,
     png, jpg, jpeg, jpe, gif, webp]
  endpoints:
    default: &uploads
      fileSizeLimit: 100
      supportedMimeTypes:
        - '^application/(pdf|json|xml|yaml|x-yaml|vnd\.ms-excel)$'
        - '^application/vnd\.openxmlformats-officedocument\.(wordprocessingml\.document|spreadsheetml\.sheet|presentationml\.presentation)$'
        - '^text/(plain|html|csv|tab-separated-values|xml|yaml|x-yaml|markdown|x-markdown)$'
        - '^image/(png|jpeg|gif|webp)$'
    agents: *uploads
    bedrock: *uploads

# Every upload is screened before it is processed or stored. Its bytes must match
# its extension; it waits in the quarantine bucket (AWS_QUARANTINE_BUCKET_NAME)
# until GuardDuty Malware Protection tags it clean; and the text of a document,
# a text file or an image (read by Amazon Textract) goes to the stack's Bedrock
# guardrail (piiMasking.guardrail, the one that masks prompts), whose
# report must contain none of the identifiers below. A refused upload is deleted
# and the user is told why. Images inside documents are
# not read. Legacy .doc, .ppt, .rtf and .epub are not accepted, because their text
# cannot be extracted for screening. Images are limited to the formats Bedrock
# models accept: PNG, JPEG, GIF and WebP.
uploadScreening:
  malware: guardduty
  scanTimeoutSeconds: 60
  pii:
    detector: guardrail
    maxCharacters: 2000000
    images: textract
    # `entities` is left at its default: every guardrail type that identifies a
    # person, account or secret, universal and UK, except NAME, URL and AGE.

# Personal identifiers are masked with the stack's guardrail (terraform/guardrail.tf)
# so the app neither stores them nor sends them to a model. What a user writes is
# masked before it is saved: messages they send or edit, and titles they set. Before
# a model call the whole history is masked again, from a cache, along with a title's
# input and answers to the model's clarifying questions. The user and the model see
# {EMAIL}, {PHONE} and so on. Model responses are stored as written; the output
# guardrail on the model calls (endpoints.bedrock above) detects identifiers in them.
# System prompts and tool results are not masked. Langfuse traces are masked too,
# every string in them, before they are exported.
piiMasking:
  guardrail:
    guardrailIdentifier: '${BEDROCK_GUARDRAIL_ID}'
    guardrailVersion: '${BEDROCK_GUARDRAIL_VERSION}'

# Safeguarding (terraform/safeguarding.tf): content filters, denied topics and
# word lists on what participants write (messages, quotes, answers to the
# assistant's questions), the text of their uploads, and the assistant's replies.
# A detection at a `flag` level is logged for the safeguarding team (HyperDX,
# and a `safeguarding` score on the Langfuse trace) and the content goes on. At a
# `block` level the content is blocked: the participant is told why and
# shown the support services (openingHours.support, unless `signposting` lists
# others), and the Designated Safeguarding Leads are emailed through
# alerts.topicArn. Levels are the lowest guardrail confidence (LOW, MEDIUM,
# HIGH) that counts; OFF never does. Terraform reads `block` and `topics`
# from this file to set the chat guardrail's blocking strengths, so tune them
# here, from pilot testing, and apply. Topic names must match the guardrail's.
safeguarding:
  guardrail:
    guardrailIdentifier: '${BEDROCK_SAFEGUARDING_GUARDRAIL_ID}'
    guardrailVersion: '${BEDROCK_SAFEGUARDING_GUARDRAIL_VERSION}'
  flag:
    HATE: MEDIUM
    INSULTS: MEDIUM
    SEXUAL: MEDIUM
    VIOLENCE: MEDIUM
    MISCONDUCT: MEDIUM
    PROMPT_ATTACK: MEDIUM
  block:
    HATE: HIGH
    INSULTS: HIGH
    SEXUAL: HIGH
    VIOLENCE: HIGH
    MISCONDUCT: HIGH
    PROMPT_ATTACK: HIGH
  topics:
    self-harm: block
    suicidal-ideation: block
    acute-distress: block
    bullying: block
  # Word list matches (the Imagination Tool list and AWS's profanity list) are
  # only ever flagged.
  words: flag
  # A message or upload is refused when the guardrail cannot be reached.
  onError: refuse
  alerts:
    topicArn: '${SAFEGUARDING_ALERT_TOPIC_ARN}'

# Voice input starts off. This is only a default: a browser that already saved a
# choice keeps it, and users can turn it on again in Settings > Speech.
speech:
  speechTab:
    speechToText: false

# Enforced on the server for every chat, agent and API request. A message over
# maxUserMessageChars is refused before it reaches a model; maxOutputTokens caps
# each response, reasoning included (Bedrock counts both against one budget).
# Available 06:00-22:00 UK time every day, the same for everyone, so any
# safeguarding alert arises while the safeguarding team is working. Outside
# these hours the API answers 503 and the browser shows a resting page that
# points to these services.
openingHours:
  open: "06:00"
  close: "22:00"
  timezone: "Europe/London"
  support:
    - name: "In an emergency"
      description: "If you or someone else is in danger right now, call 999."
      phone: "999"
    - name: "Childline"
      description: "Free, private and confidential support for anyone under 19, about anything."
      phone: "0800 1111"
      url: "https://www.childline.org.uk"
    - name: "Shout"
      description: "Free, confidential support by text message, any time."
      text: "Text SHOUT to 85258"
      url: "https://giveusashout.org"
    - name: "Samaritans"
      description: "Someone to talk to, any time, whatever you are going through."
      phone: "116 123"
      url: "https://www.samaritans.org"

messageLimits:
  maxUserMessageChars: 20000
  maxOutputTokens: 8192

# Per-user usage quota: $1.50 of model cost per 5-hour session (1,000,000
# credits = $1, charged at each model's price). That is about 100 typical
# Sonnet 5 turns (3,000 tokens in, history included, and 800 out). A user who
# runs out is refused until 5 hours after their last refill; their next request
# then refills them. Refills only top up an exhausted balance, so unused quota
# does not pile up.
balance:
  enabled: true
  startBalance: 1500000
  autoRefillEnabled: true
  refillIntervalValue: 5
  refillIntervalUnit: 'hours'
  refillAmount: 1500000

actions:
  allowedDomains:
    - 'google.com'

endpoints:
  agents:
    capabilities: ["context", "ask_user_question", "tools"]
    # A failed model call logs the provider's own message, masked with the
    # piiMasking guardrail first, since it can echo what was sent.
    logProviderErrors: true

  # The sandbox is an AWS channel-program account: Bedrock refuses Anthropic
  # models there. These are the models it does serve on demand in eu-west-2, so
  # requests stay in London; each was checked with streaming and tool use.
  bedrock:
    models:
      - 'amazon.nova-lite-v1:0'
      - 'openai.gpt-oss-120b-1:0'
      - 'qwen.qwen3-235b-a22b-2507-v1:0'
      - 'moonshotai.kimi-k2.5'
      - 'deepseek.v3.2'
      - 'mistral.devstral-2-123b'
      - 'zai.glm-5'
      - 'nvidia.nemotron-super-3-120b'
    # The stack's chat guardrail (terraform/guardrail.tf) checks only what the
    # model writes; its prompt checks are off, since the app screens and masks
    # prompts itself (safeguarding and piiMasking below) and Bedrock would refuse a
    # conversation over about 106,000 characters. It detects personal identifiers,
    # and blocks content filters and denied topics at safeguarding's `block`
    # levels. `sync` holds each part of the response until it has been checked,
    # so a blocked part never reaches the participant (earlier parts already
    # have). `enabled_full` reports every filter's confidence, blocking or not,
    # so the app can flag those at the `flag` levels. The app logs what was
    # found, never the text, then drops the trace, which holds the matches.
    guardrailConfig:
      guardrailIdentifier: '${BEDROCK_OUTPUT_GUARDRAIL_ID}'
      guardrailVersion: '${BEDROCK_OUTPUT_GUARDRAIL_VERSION}'
      trace: 'enabled_full'
      streamProcessingMode: 'sync'

modelSpecs:
  list:
    - name: 'bedrock-nova-lite'
      label: 'Nova Lite (Bedrock)'
      description: 'Amazon Nova Lite v1 via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'amazon.nova-lite-v1:0'
    - name: 'bedrock-gpt-oss-120b'
      label: 'gpt-oss-120b (Bedrock)'
      description: 'OpenAI open-weight 120B model via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'openai.gpt-oss-120b-1:0'
    - name: 'bedrock-qwen3-235b'
      label: 'Qwen3 235B (Bedrock)'
      description: 'Qwen3 235B A22B 2507 via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'qwen.qwen3-235b-a22b-2507-v1:0'
    - name: 'bedrock-kimi-k2-5'
      label: 'Kimi K2.5 (Bedrock)'
      description: 'Moonshot AI Kimi K2.5 via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'moonshotai.kimi-k2.5'
    - name: 'bedrock-deepseek-v3-2'
      label: 'DeepSeek V3.2 (Bedrock)'
      description: 'DeepSeek V3.2 via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'deepseek.v3.2'
    - name: 'bedrock-devstral-2'
      label: 'Devstral 2 (Bedrock)'
      description: 'Mistral AI Devstral 2 123B, tuned for coding, via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'mistral.devstral-2-123b'
    - name: 'bedrock-glm-5'
      label: 'GLM-5 (Bedrock)'
      description: 'Z.ai GLM-5 via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'zai.glm-5'
    - name: 'bedrock-nemotron-super-3'
      label: 'Nemotron Super 3 (Bedrock)'
      description: 'NVIDIA Nemotron Super 3 120B via AWS Bedrock (eu-west-2, on-demand)'
      preset:
        endpoint: 'bedrock'
        model: 'nvidia.nemotron-super-3-120b'
